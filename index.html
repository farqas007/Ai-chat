<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Chat</title>

    <meta name="description" content="Advanced AI Chat Assistant">

    <meta name="theme-color" content="#0f172a">


    <!-- Main Styles -->

    <link rel="stylesheet" href="css/themes.css">

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/sidebar.css">

    <link rel="stylesheet" href="css/chat.css">

    <link rel="stylesheet" href="css/responsive.css">


    <!-- Favicon -->

    <link rel="icon" href="data:,">

</head>


<body>


<div id="app">


    <!-- Sidebar -->

    <aside id="sidebar">


        <div class="sidebar-header">

            <h2>
                AI Chat
            </h2>


            <button id="newChatBtn">

                + New Chat

            </button>


        </div>



        <div id="conversationList">

            <!-- Chats inserted by JS -->

        </div>



        <div class="sidebar-bottom">


            <button id="settingsBtn">

                ⚙ Settings

            </button>


        </div>


    </aside>




    <!-- Main Area -->

    <main id="main">


        <!-- Top Bar -->

        <header id="topbar">


            <button id="menuBtn">

                ☰

            </button>



            <h1>

                AI Assistant

            </h1>


<button id="voiceToggle">

    🎤

</button>


<button id="themeToggle">

    🌙

</button>


        </header>




        <!-- Chat Container -->

        <section id="chatContainer">

<div id="error" class="hidden"></div>

           <div id="messages">


    <div class="welcome">

        <h2>
            Hello 👋
        </h2>

        <p>
            How can I help you today?
        </p>

    </div>


</div>


            <!-- Typing Indicator -->

            <div id="typingIndicator" class="hidden">

                AI is typing...

            </div>


        </section>





        <!-- Input Area -->

        <footer id="inputArea">


            <textarea

                id="messageInput"

                placeholder="Type your message..."

                rows="1">

            </textarea>




            <button id="imageBtn">

                🖼

            </button>




            <button id="sendBtn" title="Send message">

    ➤

</button>

<button id="voiceInputBtn" title="Voice">

    🎤

</button>


        </footer>



    </main>



</div>





<!-- Settings Modal -->

<div id="settingsModal" class="hidden">


    <div class="settings-box">


        <h2>

            Settings

        </h2>



        <label>

            Theme

            <select id="themeSelect">

                <option value="dark">

                    Dark

                </option>


                <option value="light">

                    Light

                </option>


            </select>


        </label>



        <label>

            Voice

            <select id="voiceSelect">

            </select>

        </label>



        <button id="closeSettings">

            Close

        </button>



    </div>


</div>






<!-- Application Entry -->

<script type="module" src="js/main.js"></script>


</body>


</html>
