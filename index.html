<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Chat</title>

    <meta name="description" content="Advanced AI Chat Assistant">

    <meta name="theme-color" content="#0f172a">


    <!-- Main Styles -->

    <link rel="stylesheet" href="css/themes.css">

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/sidebar.css">

    <link rel="stylesheet" href="css/chat.css">

    <link rel="stylesheet" href="css/responsive.css">


    <!-- Favicon -->

    <link rel="icon" href="data:,">

</head>


<body>


<div id="app">


    <!-- Sidebar -->

    <aside id="sidebar">


        <div class="sidebar-header">

            <h2>
                AI Chat
            </h2>


            <button id="newChatBtn">

                + New Chat

            </button>


        </div>



        <div id="conversationList">

            <!-- Chats inserted by JS -->

        </div>



        <div class="sidebar-bottom">


            <button id="settingsBtn" aria-label="Settings">

                <svg class="icon-btn" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>

                <span>Settings</span>

            </button>


        </div>


    </aside>




    <!-- Main Area -->

    <main id="main">


        <!-- Top Bar -->

        <header id="topbar">


            <button id="menuBtn" aria-label="Menu" title="Menu">

                <svg class="icon-btn" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>

            </button>



            <h1>

                AI Assistant

            </h1>


<button id="voiceToggle" aria-label="Toggle voice playback" title="Toggle voice playback">

    <svg class="icon-btn" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>

</button>


<button id="themeToggle" aria-label="Toggle theme" title="Toggle theme">

    <svg class="icon-btn" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>

</button>


        </header>




        <!-- Chat Container -->

        <section id="chatContainer">

<div id="error" class="hidden"></div>

           <div id="messages">


    <div class="welcome">

        <h2>
            Hello
        </h2>

        <p>
            How can I help you today?
        </p>

    </div>


</div>


            <!-- Typing Indicator -->

            <div id="typingIndicator" class="hidden">

                AI is typing...

            </div>


        </section>





        <!-- Input Area -->

        <footer id="inputArea">


            <textarea

                id="messageInput"

                placeholder="Type your message..."

                rows="1">

            </textarea>




            <button id="imageBtn" aria-label="Generate image" title="Generate image">

                <svg class="icon-btn" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>

            </button>




            <button id="sendBtn" title="Send message" aria-label="Send message">

    <svg class="icon-btn" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>

</button>

<button id="voiceInputBtn" title="Voice" aria-label="Voice input">

    <svg class="icon-btn" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>

</button>


        </footer>



    </main>



</div>





<!-- Settings Modal -->

<div id="settingsModal" class="hidden">


    <div class="settings-box">


        <h2>

            Settings

        </h2>



        <label>

            Theme

            <select id="themeSelect">

                <option value="dark">

                    Dark

                </option>


                <option value="light">

                    Light

                </option>


            </select>


        </label>



        <label>

            Voice

            <select id="voiceSelect">

            </select>

        </label>



        <button id="closeSettings">

            Close

        </button>



    </div>


</div>






<!-- Application Entry -->

<script type="module" src="js/main.js"></script>


</body>


</html>
